name: desktop-quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frozen dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Validate localization references
        run: npm run check:i18n
      - name: Lint Desktop sources
        run: npm run lint
      - name: Typecheck Desktop sources
        run: npm run typecheck
      - name: Test Desktop components and tooling
        run: npm test
      - name: Test Electron E2E launch helpers
        run: npm run test:e2e:helpers
      - name: Build main, preload and renderer
        run: npm run build
