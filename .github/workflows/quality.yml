name: quality
on:
  push:
  pull_request:
jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.14
          working-directory: python
      - name: Install pinned Python runtime
        run: uv python install 3.12.13
      - run: pnpm install --frozen-lockfile
      - name: Check Python Host and business runtime
        run: pnpm py:check
      - name: Validate reference and production contracts
        run: pnpm validate:contracts
      - name: Validate Playbook task map against the specification
        run: pnpm validate:task-map
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
