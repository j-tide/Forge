function card(t){const c={todo:'',dev:'blue',review:'purple',verify:'amber',done:'green'}[t.stage],label=t.stage==='dev'?(t.paused?'已暂停':'执行中'):t.stage==='review'?'待审查':t.stage==='verify'?'待你验收':t.stage==='done'?'已完成':t.kind;return `<button class="task-card ${t.stage==='dev'?'running':''} ${t.fresh?'fresh':''}" data-task="${t.id}" aria-label="查看任务 ${esc(t.title)}"><div class="card-top"><span>${t.id}</span><span class="priority"><i></i><i></i><i></i></span></div><h3>${esc(t.title)}</h3><div class="card-tags">${tag(label,c)}${t.stage==='dev'?tag('3 个文件'):t.stage==='review'?tag('1 个阻塞项'):t.stage==='verify'?tag('3 / 3 通过'):''}</div><div class="card-bottom"><span class="agent-orb ${t.stage==='dev'?'dark':''}">${I(t.stage==='dev'?'code':t.stage==='done'?'check':t.stage==='review'?'shield':t.stage==='verify'?'check':'clock')}</span><span>${esc(t.agent)}</span><time>${esc(t.time)}</time></div>${t.stage==='dev'?'<div class="card-progress"><b></b></div>':''}</button>`}

function workflowView(){const nodes=[['plan','计划','Planner','file'],['develop','开发','Developer','code'],['review','Review','Reviewer','shield'],['verify','验证','Project checks','check'],['accept','确认','你','lock']];const n=nodes.find(n=>n[0]===state.selectedNode)||nodes[2];return `<div class="view">${pageHead('让每个角色，恰好接棒。','一套好的默认流程，也留给你足够的自由。',btn('校验流程','validate-flow','','check')+btn('发布新版本','publish-flow','primary'),'WORKFLOWS / STANDARD · V'+state.workflowVersion)}<div class="flow-preset"><button class="btn small selected" data-action="preset" data-value="标准研发">标准研发</button><button class="btn small" data-action="preset" data-value="快速交付">快速交付</button><span class="spacer"></span><span class="tag">配置草稿 · 不影响运行中的任务</span></div><div class="workflow-layout"><div class="pane flow-pane" style="padding:15px"><div class="flow-canvas"><div class="flow-label">默认研发流程<span style="color:#97a4b6;margin-left:12px">从想法到交付</span></div><div class="flow-nodes">${nodes.map((x,i)=>`${i?'<div class="flow-connector"></div>':''}<button class="flow-node ${state.selectedNode===x[0]?'selected':''}" data-node="${x[0]}"><small>${x[0].toUpperCase()}</small><h3>${x[1]}</h3><div class="row-pill"><span class="agent-orb">${I(x[3])}</span><span style="font-size:9px;color:#7c8fa8">${x[2]}</span></div></button>`).join('')}</div><div class="flow-return"><span>需要修改 · 退回开发，最多 3 次</span></div></div><div class="flow-tip">${I('lock')} 检查结果通过后才会流转。完成不等于合并。</div></div><div class="pane page-scroll" style="padding:23px 21px"><div class="panel-top"><div><div class="overline">STAGE CONFIGURATION</div><h2 style="margin:0">${n[1]}节点</h2></div><span class="soft-icon">${I(n[3])}</span></div>${state.selectedNode==='review'||state.selectedNode==='develop'||state.selectedNode==='plan'?`<div class="field"><label>Agent 角色</label><select id="flow-profile"><option>${state.selectedNode==='review'?state.flowAgent:n[2]}</option><option>自定义角色</option></select></div><div class="field"><label>执行器</label><select id="flow-executor ="note">示例差异，仅展示代码阅读区。正式产品绑定当前任务快照。</p>`;if(state.detailTab==='checks')body=t.stage==='review'?`<div class="callout" style="background:#e7c8d225;color:#98707d">${I('shield')}有 1 个阻塞问题，需要修复后重新审查。</div><div class="reading-surface"><h3 style="font-size:13px">零金额不能被当成空值</h3><p style="font-size:11px;color:#748299">当前示例实现使用 <code>!amount</code> 判断空值。金额为 0 时也会显示“—”，不符合 AC-02。</p><div class="code-block"><span class="remove">− if (!amount) return '—'</span><span class="add">+ if (amount == null) return '—'</span></div></div><p class="note">审查意见应附带位置、规则与代码快照，不只给出“建议优化”。</p>`:`<div class="reading-surface">${checksMarkup(t.criteria,true)}</div><div class="callout" style="margin-top:18px">${I('shield')}展示的是样例检查结果，未实际执行项目测试。</div>${t.stage==='verify'?'<label class="check-row" style="font-size:11px"><input id="manual-accept" type="checkbox" style="margin-top:5px;accent-color:#7395be">我已查看当前版本，确认可以接受这次交付。</label>':''}`;let actions=t.stage==='todo'?btn('开始任务','start-task','primary','play'):t.stage==='dev'?btn(t.paused?'继续执行':'暂停执行','pause-task','',t.paused?'play':'pause')+btn('查看检查','show-checks','primary','arrow'):t.stage==='review'?btn('查看阻塞问题','show-checks','')+btn('带问题退回开发','rework-task','primary','back'):t.stage==='verify'?btn('查看验收','show-checks','')+btn('接受当前交付','accept-task','primary','check'):btn('关闭详情','close-modal','primary','check');return modalShell(`${modalHeader(t.id+' · '+stages.find(s=>s.id===t.stage).label,'任务详情 / 演示快照','file')}<div class="sheet-body"><h1>${esc(t.title)}</h1><div class="detail-tag-row">${tag(t.stage==='dev'?(t.paused?'已暂停':'执行中'):stages.find(s=>s.id===t.stage).label,t.stage==='dev'?'blue':t.stage==='verify'?'amber':'')} ${tag(t.agent)}<code>合同 v1</code></div><div class="tabs">${[['brief','需求'],['activity','活动'],['diff','变更'],['checks','检查']].map(([id,title])=>`<button class="${state.detailTab===id?'active':''}" data-detail-tab="${id}">${title}</button>`).join('')}</div>${body}</div><footer class="sheet-footer"><small>已完成不等于已合并。</small><div class="actions">${actions}</div></footer>`,'drawer')}
function profileModal(){const p=profileData[state.selectedProfile??2];return modalShell(`${modalHeader('配置 '+p.name,'角色、执行器与模型分别配置','agents')}<div class="sheet-body"><div class="form-grid"><div><div class="field"><label>角色名称</label><input value="${p.name}" id="profile-name"></div><div class="field"><label>执行器</label><select id="profile-executor"><option>${p.executor}</option><option>${p.executor==='Codex SDK'?'Claude Agent SDK':'Codex SDK'}</option></select></div><div class="field"><label>角色指令</label><textarea style="height:135px">围绕已批准的任务和当前代码快照工作。\n交付结论附带可核查的产物。\n不改变用户验收标准，不自行扩大权限。\n证据不足时说明未完成事项。</textarea></div></div><aside class="reading-surface"><h3>权限边界</h3><p style="font-size:10px;color:#72859d;line-height:2">${p.scope}<br>不自动合并代码<br>不扩大执行权限</p><h3 style="margin-top:25px">模型</h3><p style="font-size:10px;color:#72859d">真实产品从执行器返回的兼容列表选择，不提供虚构型号。</p></aside></div></div><footer class="sheet-footer"><small>修改只影响新建的执行。</small><div class="actions">${btn('取消','close-modal','subtle')}${btn('保存配置草稿','save-profile','primary','check')}</div></footer>`)}
function searchModal(){return modalShell(`${modalHeader('找到你正在推进的事','⌘ K / Ctrl K · Esc 关闭','search')}<div class="sheet-body"><div class="search-field"><input id="task-search" style="width:100%;font-size:13px" aria-label="搜索任务标题或编号" placeholder="输入任务标题或编号…" autofocus></div><div id="search-results" style="margin-top:15px">${searchRows('')}</div></div>`)}
function searchRows(q){const r=tasks.filter(t=>(t.id+' '+t.title).toLowerCase().includes(q.toLowerCase()));return r.length?r.map(t=>`<button class="row" style="width:100%;text-align:left" data-task="${t.id}"><span class="soft-icon">${I('file')}</span><div><strong>${esc(t.title)}</strong><small>${t.id} · ${stages.find(s=>s.id===t.stage).label}</small></div><span class="spacer"></span>${I('arrow')}</button>`).join(''):'<div class="empty-result">没有匹配的任务。</div>'}
function mobileModal(){return `<div class="overlay" data-overlay="true"><section class="phone-preview" role="dialog" aria-modal="true" aria-label="手机端预览" tabindex="-1"><div class="phone-top"><span>9:41</span><span>● ▰</span></div><header class="phone-head"><div><div class="overline" style="margin-bottom:9px">FORGE COMPANION</div><h1>待你处理</h1><p>Mac Studio · 示例主机，未真实连接</p></div><span class="avatar">JT</span></header><div class="phone-scroll"><div class="segmented" style="width:fit-content;margin:0 0 20px"><button class="selected">全部 3</button><button data-action="mobile-filter">审批 2</button><button data-action="mobile-filter">阻塞 1</button></div><button class="task-card" data-action="mobile-draft"><div class="card-top">FG-027 <span>任务草稿</span></div><h3>${esc(state.draft.title)}</h3><p style="font-size:11px;color:#7d8ba1">3 条验收标准 · 合同 v1<br>批准后进入 TODO，不自动开工。</p><div class="card-bottom">${tag('需要你确认','blue')}<span class="spacer"></span>${I('arrow')}</div></button><button class="task-card" data-task="FG-020"><div class="card-top">FG-020 <span>交付验收</span></div><h3>统一订单金额格式化</h3><p style="font-size:11px;color:#7d8ba1">自动检查样例通过，等待人工验收。<br>所有结果都应绑定当前版本。</p><div class="card-bottom">${tag('等待验收','amber')}<span class="spacer"></span>${I('arrow')}</div></button><div class="task-card"><div class="card-top">FG-019 <span>执行受阻</span></div><h3>缺少测试环境配置</h3><p style="font-size:11px;color:#7d8ba1;margin-bottom:0">需要回到主机设置运行命令。<br>手机不会因此获得任意终端权限。</p></div><p class="note">离线时只展示最后快照，不离线排队审批。</p></div><nav class="phone-nav"><button class="active" data-action="mobile-filter">${I('inbox')}待我处理</button><button data-action="mobile-filter">${I('board')}任务</button><button data-action="close-modal">${I('devices')}返回 Desktop</button></nav><p style="font-size:8px;color:#90a0b5;text-align:center;margin:0 0 10px">手机控制端设计预览 · 非真实连接</p></section></div>`}
function renderModal(){const root=document.getElementById('modal-root');if(!root)return;root.innerHTML=state.modal==='draft'?draftModal():state.modal==='task'?taskModal():state.modal==='profile'?profileModal():state.modal==='search'?searchModal():state.modal==='mobile'?mobileModal():''}
let noticeTimer;
function toast(message){const e=document.getElementById('notice');e.textContent=message;e.classList.add('show');clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>e.classList.remove('show'),3900)}
function submitChat(){const input=document.getElementById('chat-input');const value=input?.value.trim();if(!value){toast('先写一句你想实现的功能。');input?.focus();return}state.lastMessage=value;state.draft={title:value.length>26?value.slice(0,26)+'…':value,goal:value,criteria:['请填写一条可以验证的验收标准'],priority:'普通',workflow:'标准研发流程'};state.approved=false;state.draftId=null;state.draftFromDemo=true;state.modal='draft';render();toast('这是本地交互演示：保留你的输入，请手工完善草稿；没有调用模型。')}
function approveDraft(){const title=document.getElementById('draft-title')?.value.trim();const goal=document.getElementById('draft-goal')?.value.trim();const criteria=document.getElementById('draft-criteria')?.value.split('\n').map(s=>s.trim()).filter(Boolean)||[];if(!title||!goal||!criteria.length){toast('请补齐标题、目标和至少一条验收标准。');return}if(state.draftFromDemo&&criteria.includes('请填写一条可以验证的验收标准')){toast('请将占位验收标准替换为你真正要验证的行为。');return}state.draft={title,goal,criteria,priority:document.getElementById('draft-priority')?.value||'普通',workflow:document.getElementById('draft-workflow')?.value||'标准研发流程'};const existing=tasks.find(t=>t.id===state.draftId);if(existing&&existing.stage==='todo'){existing.title=title;existing.description=goal;existing.criteria=criteria;existing.fresh=true}else{const id='FG-'+String(27+tasks.filter(t=>t.fresh).length).padStart(3,'0');state.draftId=id;tasks.unshift({id,title,description:goal,criteria,stage:'todo',kind:'已批准',agent:'等待开始',time:'刚刚',fresh:true})}state.approved=true;state.modal=null;state.page='board';render();toast('草稿已批准，进入 TODO。尚未开始开发。')}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){go(page.dataset.page);return}const t=e.target.closest('[data-task]');if(t){state.detailTab='brief';openModal('task',t.dataset.task);return}const tab=e.target.closest('[data-detail-tab]');if(tab){state.detailTab=tab.dataset.detailTab;renderModal();return}const node=e.target.closest('[data-node]');if(node){state.selectedNode=node.dataset.node;render();return}const at=e.target.closest('[data-agent-tab]');if(at){state.agentTab=at.dataset.agentTab;render();return}const kt=e.target.closest('[data-knowledge-tab]');if(kt){state.knowledgeTab=kt.dataset.knowledgeTab;render();return}const st=e.target.closest('[data-setting-tab]');if(st){state.settingsTab=st.dataset.settingTab;render();return}const profile=e.target.closest('[data-profile]');if(profile){state.selectedProfile=Number(profile.dataset.profile);openModal('profile');return}const a=e.target.closest('[data-action]');if(!a){if(e.target.dataset.overlay)closeModal();return}const action=a.dataset.action;const task=tasks.find(t=>t.id===state.selected);switch(action){
case'open-draft':openModal('draft');break;case'open-approved':state.detailTab='brief';openModal('task',state.draftId);break;case'close-modal':closeModal();break;case'send':submitChat();break;case'approve':approveDraft();break;
case'start-task':if(task?.stage!=='todo'){toast('只有已批准的 TODO 可以开始。');break}task.stage='dev';task.workflowVersion=state.workflowVersion;task.agent='Codex';task.time='刚刚';task.paused=false;state.detailTab='activity';render();toast('演示状态已进入开发中，未运行真实 Agent 或命令。');break;
case'pause-task':if(task){task.paused=!task.paused;render();toast(task.paused?'演示：任务已暂停。真实执行需等待执行器确认。':'演示：任务继续。')}break;
case'pause-current':{const running=tasks.find(t=>t.stage==='dev');if(running){running.paused=!running.paused;render();toast(running.paused?'已切换演示暂停状态，未控制真实进程。':'已恢复演示状态。')}}break;
case'show-checks':state.detailTab='checks';renderModal();break;
case'rework-task':if(task){task.stage='dev';task.agent='Codex';task.time='返工';task.paused=false;state.detailTab='activity';render();toast('演示：审查问题与当前快照交回开发。')}break;
case'accept-task':if(!document.getElementById('manual-accept')?.checked){state.detailTab='checks';renderModal();toast('请先查看检查结果，并勾选人工验收确认。');break}if(task){task.stage='done';task.agent='已接受交付';task.time='刚刚';state.modal=null;render();toast('演示交付已接受，任务完成。没有合并代码。')}break;
case'board-mode':state.boardMode=a.dataset.value;render();break;case'task-filter':state.filter=state.filter==='all'?'attention':'all';render();break;
case'maximize':state.expanded=!state.expanded;document.querySelector('.desktop')?.classList.toggle('expanded',state.expanded);if(state.page==='settings')render();break;
case'minimize':toast('这是浏览器中的设计原型。正式 Desktop 使用原生窗口最小化。');break;case'close-demo':toast('可直接关闭浏览器标签。原型不会关闭你的其他窗口。');break;
case'search':openModal('search');setTimeout(()=>document.getElementById('task-search')?.focus(),40);break;case'inbox':state.filter='attention';go('board');toast('已筛选需要你审查或验收的任务。');break;
case'new-chat':state.approved=false;state.draftId=null;state.lastMessage='告诉 Forge，你想做一个怎样的功能。';state.draft={title:'新的想法',goal:'',criteria:[],priority:'普通',workflow:'标准研发流程'};state.draftFromDemo=true;go('board');setTimeout(()=>document.getElementById('chat-input')?.focus(),0);break;
case'stage-settings':go('workflows');break;case'board-options':go('settings');break;
case'validate-flow':toast('示例流程包含开发、审查、检查、人工确认；实际发布校验需 Host 实现。');break;
case'save-node':state.flowAgent=document.getElementById('flow-profile')?.value||'Reviewer';state.flowExecutor=document.getElementById('flow-executor')?.value||state.flowExecutor;state.workflowSaved=true;toast('节点配置已保留在本次原型会话，尚未发布。');break;
case'publish-flow':state.workflowVersion++;state.workflowSaved=false;render();toast('演示：保存为流程 v'+state.workflowVersion+'，不修改既有运行配置。');break;
case'preset':toast('当前原型展示标准流程。'+a.dataset.value+'的业务执行与校验由 Host 实现。');break;
case'save-profile':{const p=profileData[state.selectedProfile??2];const name=document.getElementById('profile-name')?.value.trim();if(!name){toast('角色名称不能为空。');break}p.name=name;p.executor=document.getElementById('profile-executor')?.value||p.executor;closeModal();render();toast('角色示例配置已保存到当前会话。')}break;
case'new-profile':state.selectedProfile=2;openModal('profile');toast('先展示角色配置方式；此原型不安装真实执行器。');break;
case'toggle-glass':state.reducedGlass=!state.reducedGlass;render();break;case'toggle-motion':state.reducedMotion=!state.reducedMotion;render();break;
case'mobile-preview':openModal('mobile');break;case'mobile-draft':openModal('draft');break;
case'pair-device':toast('配对界面为后续实现，不生成可用配对凭据。可先打开手机预览。');break;
case'remote-settings':go('settings');break;case'reset-demo':location.reload();break;
case'memory-confirm':toast('示例记忆已确认。正式写入需保留来源、项目与有效期。');break;case'memory-dismiss':toast('示例候选已忽略，不应进入可信上下文。');break;
case'source-preview':toast('示例来源已在下方阅读区展示，未打开真实项目文件。');break;

case'import-doc':toast('正式产品在此选择文件、检查来源并建立索引；当前为设计展示。');break;
case'plugin-detail':state.agentTab='plugins';go('agents');toast('插件权限来自 Manifest 申请，最终由 Host 与用户授权。');break;
default:toast('这是 '+a.textContent.trim()+' 的设计入口；没有调用后台服务。');}}
);
document.addEventListener('input',e=>{if(e.target.id==='task-search')document.getElementById('search-results').innerHTML=searchRows(e.target.value);if(e.target.id==='knowledge-search')document.getElementById('knowledge-rows').innerHTML=knowledgeRows(e.target.value)});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openModal('search');setTimeout(()=>document.getElementById('task-search')?.focus(),30);return}if(e.key==='Escape'&&state.modal){e.preventDefault();closeModal();return}if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitChat();return}if(e.key==='Enter'&&e.target.matches('tr[data-task]')){state.detailTab='brief';openModal('task',e.target.dataset.task);return}if(e.key==='Tab'&&state.modal){const dlg=document.querySelector('[role="dialog"]');if(!dlg)return;const list=[...dlg.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!list.length){e.preventDefault();dlg.focus();return}const first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dlg)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dlg)){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'board';state.modal=null;render()});
state.page=location.hash.slice(1)||'board';render();
