openapi: 3.1.0
info:
  title: Forge Host Gateway API
  version: 1.0.0
  description: 实施契约，不是已部署服务。LocalTransport 使用同一 CommandService。Remote 默认仅开放白名单方法。身份由认证注入，禁止客户端
    actor/scopes。
servers:
- url: https://forge-host.example.invalid
  description: 示例地址，部署时由本地主机配置
security:
- sessionCookie: []
paths:
  /v1/commands:
    post:
      operationId: executeCommand
      summary: 提交带幂等与版本的受控命令
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Command'
      responses:
        '200':
          description: 已执行或幂等原结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '202':
          description: 已持久化接收，异步执行；不代表任务完成
        '400': &id001
          description: 明确错误；不自动重放审批或未知副作用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
        '429': *id001
        '500': *id001
      description: 本Schema是本地/远端共用命令合集。Gateway在认证后、payload日志和调度前按planning/commands.json的remoteAllowed白名单拒绝本地专属方法。credentials.set永不进入HTTP网关；secretValue仅本地IPC，禁止写入receipt、events、诊断或错误details。审批kind再做逐项scope检查。
  /v1/health:
    get:
      operationId: health
      summary: 网关健康（不暴露敏感配置）
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostHealth'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/capabilities:
    get:
      operationId: capabilities
      summary: 当前设备与Host能力
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/projects:
    get:
      operationId: listProjects
      summary: 有权限的项目
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/projects/{projectId}/board:
    get:
      operationId: getBoard
      summary: 看板权威快照
      parameters:
      - name: projectId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardSnapshot'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: 任务、revision、AC与权限
      parameters:
      - name: taskId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/runs/{runId}:
    get:
      operationId: getRun
      summary: Run配置与Attempt概要
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/runs/{runId}/events:
    get:
      operationId: listRunEvents
      summary: 分页事件
      parameters:
      - name: runId
        in: path
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/approvals:
    get:
      operationId: listApprovals
      summary: 当前设备可决定的待审事项
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      summary: 经授权与MIME处理的产物
      parameters:
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/workflows:
    get:
      operationId: listWorkflows
      summary: 已发布和可见草稿
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/profiles:
    get:
      operationId: listProfiles
      summary: 可选角色及能力
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/plugins:
    get:
      operationId: listPlugins
      summary: 内置插件状态（手机只读子集）
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/knowledge/search:
    get:
      operationId: searchKnowledge
      summary: 过滤后的检索结果
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: projectId
        in: query
        required: true
        schema:
          type: string
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/devices:
    get:
      operationId: listDevices
      summary: 已配对设备（默认仅本地管理员）
      parameters: []
      responses:
        '200':
          description: 有权限的权威数据，包含revision/cursor及适用状态
        '401': *id001
        '403': *id001
        '404': *id001
  /v1/events:
    get:
      operationId: subscribeEvents
      summary: 认证SSE增量事件，游标过期先重新取快照
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      - name: projectId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: text/event-stream；心跳、domain event、resync_required
          content:
            text/event-stream:
              schema:
                type: string
        '401': *id001
        '403': *id001
  /v1/pair/claim:
    post:
      operationId: claimPairing
      security: []
      summary: 消费一次性nonce，只进入待本机批准状态
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - nonce
              - deviceLabel
              properties:
                nonce:
                  type: string
                  minLength: 22
                deviceLabel:
                  type: string
                  maxLength: 80
      responses:
        '202':
          description: pending，本机确认后才建立授权会话
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  pairingId: &id002
                    type: string
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
                  claimSecret:
                    type: string
                    minLength: 22
                  status:
                    const: pending
                  expiresAt:
                    type: string
                    format: date-time
                required:
                - pairingId
                - claimSecret
                - status
                - expiresAt
        '400': *id001
        '403': *id001
        '429': *id001
  /v1/pair/status:
    post:
      operationId: pollPairing
      security: []
      summary: 用高熵短期claimSecret查询本机批准；成功设置HttpOnly会话cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - claimSecret
              properties:
                claimSecret:
                  type: string
                  minLength: 22
      responses:
        '200':
          description: pending/approved/rejected；approved只交换一次
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    enum:
                    - pending
                    - approved
                    - rejected
                    - expired
                  deviceId:
                    type:
                    - string
                    - 'null'
                  csrfToken:
                    type:
                    - string
                    - 'null'
                  expiresAt:
                    type:
                    - string
                    - 'null'
                required:
                - status
                - deviceId
                - csrfToken
                - expiresAt
        '403': *id001
        '429': *id001
  /v1/session/refresh:
    post:
      operationId: refreshSession
      summary: 旋转受限会话；检查Origin、CSRF与device状态
      responses:
        '200':
          description: 新cookie，旧凭据失效或极短有界重叠
        '401': *id001
        '403': *id001
      parameters:
      - in: header
        name: X-CSRF-Token
        required: true
        schema: &id003
          type: string
          minLength: 1
  /v1/commands/{commandId}:
    get:
      operationId: getCommandId
      summary: 授权查询已提交操作/上下文；不以ID作为授权依据
      parameters:
      - in: path
        name: commandId
        required: true
        schema: *id002
      responses:
        '200':
          description: 当前权限过滤后的记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandReceipt'
        '403':
          description: 不属于该主体/项目
        '404':
          description: 不存在
  /v1/operations/{operationId}:
    get:
      operationId: getOperationId
      summary: 授权查询已提交操作/上下文；不以ID作为授权依据
      parameters:
      - in: path
        name: operationId
        required: true
        schema: *id002
      responses:
        '200':
          description: 当前权限过滤后的记录
        '403':
          description: 不属于该主体/项目
        '404':
          description: 不存在
  /v1/context-bundles/{contextId}:
    get:
      operationId: getContextId
      summary: 授权查询已提交操作/上下文；不以ID作为授权依据
      parameters:
      - in: path
        name: contextId
        required: true
        schema: *id002
      responses:
        '200':
          description: 当前权限过滤后的记录
        '403':
          description: 不属于该主体/项目
        '404':
          description: 不存在
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: forge_session
  schemas:
    TaskContract:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          const: '1.0'
        taskId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        projectId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum:
          - feature
          - bug
          - refactor
          - chore
        goal:
          type: string
          minLength: 1
        acceptance:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
              statement:
                type: string
                minLength: 1
              method:
                type: string
                enum:
                - automated
                - manual
                - inspection
              required:
                type: boolean
              sourceRefs:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 0
            required:
            - id
            - statement
            - method
            - required
            - sourceRefs
          minItems: 1
        constraints:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        scope:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        outOfScope:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        dependencies:
          type: array
          items:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          minItems: 0
        openQuestions:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        assumptions:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        sourceRefs:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 0
        workflowRef:
          type: string
          minLength: 1
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          - urgent
      required:
      - schemaVersion
      - taskId
      - projectId
      - revision
      - title
      - type
      - goal
      - acceptance
      - constraints
      - scope
      - outOfScope
      - dependencies
      - openQuestions
      - assumptions
      - sourceRefs
      - workflowRef
      - priority
    Workflow:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          const: '1.0'
        id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        revision:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 1
        start:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        nodes:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
              kind:
                type: string
                enum:
                - agent
                - command
                - verifier
                - approval
                - condition
              label:
                type: string
                minLength: 1
              boardColumn:
                type: string
                enum:
                - todo
                - development
                - review
                - verify
                - done
              binding:
                type: string
                minLength: 1
              requiredCapabilities:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 0
              inputs:
                type: array
                items:
                  type: string
                  minLength: 1
                minItems: 0
              outputSchema:
                type: string
                minLength: 1
              timeoutSeconds:
                type: integer
                minimum: 1
              retryLimit:
                type: integer
                minimum: 0
              readOnly:
                type: boolean
            required:
            - id
            - kind
            - label
            - boardColumn
            - binding
            - requiredCapabilities
            - inputs
            - outputSchema
            - timeoutSeconds
            - retryLimit
            - readOnly
          minItems: 1
        edges:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
              'on':
                type: string
                minLength: 1
              to:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
            required:
            - from
            - 'on'
            - to
          minItems: 0
        rework:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              from:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
              'on':
                type: string
                minLength: 1
              to:
                type: string
                pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
              maxCycles:
                type: integer
                minimum: 1
              invalidateDescendants:
                const: true
            required:
            - from
            - 'on'
            - to
            - maxCycles
            - invalidateDescendants
          minItems: 0
        maxTotalAttempts:
          type: integer
          minimum: 1
        onUnmatched:
          const: escalate
        finalAcceptance:
          const: human
      required:
      - schemaVersion
      - id
      - revision
      - name
      - start
      - nodes
      - edges
      - rework
      - maxTotalAttempts
      - onUnmatched
      - finalAcceptance
    ProjectCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        canonicalPath:
          type: string
        defaultBranch:
          type: string
      required:
      - name
      - canonicalPath
      - defaultBranch
    ProjectArchive:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    EnvironmentSave:
      type: object
      additionalProperties: false
      properties:
        environmentId:
          type: string
        name:
          type: string
        config:
          type: object
          additionalProperties: false
          properties:
            commandPresetIds:
              type: array
              items: *id002
            envRefs:
              type: array
              items: *id002
            networkMode:
              enum:
              - trusted-local
              - native-sandbox
          required:
          - commandPresetIds
          - envRefs
          - networkMode
      required:
      - environmentId
      - name
      - config
    ConversationSend:
      type: object
      additionalProperties: false
      properties:
        conversationId:
          type: string
        text:
          type: string
          minLength: 1
        attachmentIds:
          type: array
          items:
            type: string
      required:
      - conversationId
      - text
      - attachmentIds
    TaskCreateDraft:
      type: object
      additionalProperties: false
      properties:
        contract:
          $ref: '#/components/schemas/TaskContract'
      required:
      - contract
    TaskRevise:
      type: object
      additionalProperties: false
      properties:
        contract:
          $ref: '#/components/schemas/TaskContract'
        reason:
          type: string
      required:
      - contract
      - reason
    TaskApprove:
      type: object
      additionalProperties: false
      properties:
        approvalId:
          type: string
        scopeHash:
          type: string
      required:
      - approvalId
      - scopeHash
    TaskReorder:
      type: object
      additionalProperties: false
      properties:
        beforeTaskId:
          type:
          - string
          - 'null'
        afterTaskId:
          type:
          - string
          - 'null'
      required:
      - beforeTaskId
      - afterTaskId
    TaskArchive:
      type: object
      additionalProperties: false
      properties: {}
      required: []
    RunStart:
      type: object
      additionalProperties: false
      properties:
        workflowId:
          type: string
        workflowRevision:
          type: integer
        environmentId:
          type: string
      required:
      - workflowId
      - workflowRevision
      - environmentId
    RunPause:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
      required:
      - reason
    RunResume:
      type: object
      additionalProperties: false
      properties:
        mode:
          enum:
          - native-resume
          - new-attempt
        reason:
          type: string
      required:
      - mode
      - reason
    RunCancel:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
      required:
      - reason
    ApprovalDecide:
      type: object
      additionalProperties: false
      properties:
        approvalId:
          type: string
        scopeHash:
          type: string
        decision:
          enum:
          - approve
          - reject
        reason:
          type: string
      required:
      - approvalId
      - scopeHash
      - decision
      - reason
    AcceptanceDecide:
      type: object
      additionalProperties: false
      properties:
        approvalId:
          type: string
        scopeHash:
          type: string
        snapshotId:
          type: string
        decision:
          enum:
          - accept
          - reject
        reason:
          type: string
      required:
      - approvalId
      - scopeHash
      - snapshotId
      - decision
      - reason
    DeliveryMerge:
      type: object
      additionalProperties: false
      properties:
        sourceSnapshotId:
          type: string
        expectedTargetHead:
          type: string
        approvalId:
          type: string
        scopeHash:
          type: string
      required:
      - sourceSnapshotId
      - expectedTargetHead
      - approvalId
      - scopeHash
    WorkflowSave:
      type: object
      additionalProperties: false
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
      required:
      - workflow
    WorkflowPublish:
      type: object
      additionalProperties: false
      properties:
        workflowId:
          type: string
        revision:
          type: integer
        contentHash:
          type: string
      required:
      - workflowId
      - revision
      - contentHash
    ProfileSave:
      type: object
      additionalProperties: false
      properties:
        profile:
          $ref: '#/components/schemas/AgentProfile'
      required:
      - profile
    PluginConfigure:
      type: object
      additionalProperties: false
      properties:
        pluginId:
          type: string
        version:
