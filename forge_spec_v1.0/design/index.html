function render(){let page=location.hash.slice(1)||'board';if(page.startsWith('mobile-')){document.getElementById('root').innerHTML=mobile(page);return}if(!pages[page])page='board';const showChat=['board','draft','task','run','review','verify'].includes(page);document.getElementById('root').innerHTML=`<div class="app"><nav class="rail"><button data-nav="board" aria-label="Forge"><span class="mark"><i></i><i></i><i></i></span></button><div style="height:12px"></div>${[['board','board','研发看板'],['flow','workflows','工作流'],['agents','agents','Agent'],['plugins','plugins','插件'],['book','knowledge','知识与记忆'],['folder','projects','项目'],['devices','devices','连接与设备']].map(([ic,pg,txt])=>`<button title="${txt}" aria-label="${txt}" data-nav="${pg}" class="${page===pg||(page==='workflow'&&pg==='workflows')||(page==='profile'&&pg==='agents')?'active':''}">${I(ic)}</button>`).join('')}<div class="spacer"></div><button data-action="theme" aria-label="切换主题">${I('sun')}</button><button data-nav="settings" aria-label="设置">${I('settings')}</button><span class="avatar">JT</span></nav><div class="body"><header class="topbar"><span class="brand">Forge</span><span class="divider"></span><button class="project" data-nav="projects">${I('folder')} Order Studio <span class="subtle">⌄</span></button><span class="pill" style="margin-left:8px">main</span><div class="right"><span class="pill"><span class="dot"></span> Mac Studio · 本地</span><button data-nav="devices" title="远程设备">${I('devices')}</button><button data-action="inbox" title="待审批">${I('bell')}</button><button data-action="search">${I('search')} <kbd>⌘ K</kbd></button></div></header><div class="content">${showChat?chat():''}<main class="main">${fns[page]()}</main></div><footer class="proto-footer"><span>FORGE / 交互原型 · 所有任务与执行结果均为示例，不调用真实 Agent</span><span><a href="#board">Desktop</a>　/　<a href="#mobile-inbox">Mobile Companion</a>　·　设计规格 v1.0</span></footer></div></div>`;document.title='Forge · '+pages[page]}
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.to);window.to=setTimeout(()=>el.classList.add('hidden'),3100)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){location.hash=nav.dataset.nav;return}const a=e.target.closest('[data-action]');if(!a)return;switch(a.dataset.action){case'approve':approved=true;location.hash='board';toast('原型演示：合同 v1 已批准，FG-027 进入 TODO；未自动开工。');break;case'start':if(!approved){location.hash='draft';toast('请先批准任务合同。')}else{started=true;location.hash='run';toast('原型演示：开始任务，不会调用真实 Agent。')}break;case'pause':paused=!paused;render();toast(paused?'原型演示：请求暂停，真实产品必须等待执行器确认。':'原型演示：请求继续。');break;case'send':location.hash='draft';toast('原型演示：已将输入转换为示例任务草稿。');break;case'accept':if(!document.getElementById('manual-check')?.checked){toast('请先完成并确认人工验收项。');break}toast('原型演示：已接受当前快照，未自动合并。');location.hash='board';break;case'rework':toast('原型演示：问题与快照将交回开发；真实操作需 Host 确认。');break;case'review-ok':toast('仍有阻塞问题。需要修复或明确记录风险接受。');break;case'theme':theme=theme==='light'?'dark':'light';document.body.dataset.theme=theme;break;case'switch':a.classList.toggle('off');toast('原型设置已切换；不会影响真实系统。');break;case'mobile-approve':approved=true;location.hash='mobile-inbox';toast('原型演示：已批准当前版本，加入 TODO。');break;case'mobile-reject':location.hash='mobile-inbox';toast('原型演示：已退回修改。');break;case'pair':toast('真实实现：主机生成一次性配对码，本机确认设备权限。');break;case'validate':toast('示例流程校验通过。真实产品需验证 DAG、权限、绑定与门禁。');break;case'publish':toast('原型演示：保存为新版本，不修改活跃 Run。');break;case'stop':toast('原型演示：停止需确认进程退出后才能释放工作区。');break;case'inbox':location.hash='verify';break;case'new':location.hash='draft';break;default:toast('这是 '+a.textContent.trim()+' 的设计交互；完整行为与接口见实施蓝图。')}});
window.addEventListener('hashchange',render);document.addEventListener('keydown',e=>{if(e.target.id==='chat-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();location.hash='draft';toast('原型演示：打开标准化任务草稿。')}});render();
</script></body></html>
