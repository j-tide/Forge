[project]
name = "forge-core"
version = "0.0.1"
description = "Independent Forge Python business Host"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk==0.2.159",
  "cryptography==50.0.1",
  "jsonschema==4.26.0",
  "pydantic==2.13.5",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.8",
  "types-jsonschema==4.26.0.20260518",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
